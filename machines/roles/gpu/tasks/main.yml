---
- name: Install NVIDIA driver
  ansible.builtin.apt:
    name: "{{ gpu_nvidia_driver_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  notify: Ensure host is rebooted for NVIDIA driver

- name: Install NVIDIA repository key
  ansible.builtin.get_url:
    url: "{{ gpu_nvidia_container_toolkit_key_url }}"
    dest: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
    owner: root
    group: root
    mode: "0644"

- name: Configure NVIDIA repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/nvidia-container-toolkit.list
    owner: root
    group: root
    mode: "0644"
    content: "{{ gpu_nvidia_container_toolkit_repo }}"

- name: Install NVIDIA container toolkit
  ansible.builtin.apt:
    name: "{{ gpu_nvidia_container_toolkit_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure GPU reboot is applied
  ansible.builtin.meta: flush_handlers

- name: Verify NVIDIA GPU access
  ansible.builtin.command:
    cmd: >-
      nvidia-smi --query-gpu=name,driver_version,memory.total
      --format=csv,noheader
  register: gpu_nvidia_smi_output
  changed_when: false
  retries: 3
  delay: 5
  until: gpu_nvidia_smi_output.rc == 0
