    and verifies cluster health after bootstrap. Uses system containerd
    socket for CRI.
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: Ubuntu
      versions:
        - noble
  galaxy_tags:
    - k3s
    - kubernetes
    - k8s
    - container
dependencies: []
