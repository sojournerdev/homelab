---
- name: Check UFW status
  ansible.builtin.command:
    cmd: ufw status
  register: firewall_ufw_status
  changed_when: false
  failed_when: false

- name: Ensure UFW is disabled for K3s
  ansible.builtin.command:
    cmd: ufw disable
  register: firewall_ufw_disable
  changed_when: "'Status: active' in firewall_ufw_status.stdout"
  when:
    - firewall_ufw_status.rc == 0
    - "'Status: active' in firewall_ufw_status.stdout"

- name: Install Fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
  when: firewall_fail2ban_enabled

- name: Configure Fail2ban
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  when: firewall_fail2ban_enabled
  notify: Ensure Fail2ban is restarted

- name: Ensure Fail2ban is running
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
  when: firewall_fail2ban_enabled

- name: Ensure firewall service restarts are applied
  ansible.builtin.meta: flush_handlers
  when: firewall_fail2ban_enabled

- name: Verify Fail2ban SSH jail
  ansible.builtin.command:
    cmd: fail2ban-client status sshd
  register: firewall_fail2ban_status
  changed_when: false
  retries: 3
  delay: 5
  until: firewall_fail2ban_status.rc == 0
  when: firewall_fail2ban_enabled
