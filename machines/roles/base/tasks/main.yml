---
- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/base.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      {% for module in base_kernel_modules %}
      {{ module }}
      {% endfor %}

- name: Ensure kernel modules are loaded
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ base_kernel_modules }}"

- name: Configure sysctl settings
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  loop: "{{ base_sysctl | dict2items }}"

- name: Configure SSH hardening
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config.d/99-hardened.conf
    owner: root
    group: root
    mode: "0600"
    validate: "sshd -t -f %s"
  notify: Ensure SSH service is restarted

- name: Configure time synchronization
  ansible.builtin.template:
    src: timesyncd.conf.j2
    dest: /etc/systemd/timesyncd.conf
    owner: root
    group: root
    mode: "0644"
  notify: Ensure time synchronization is restarted

- name: Ensure unattended upgrades are installed
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Configure automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

- name: Ensure base service restarts are applied
  ansible.builtin.meta: flush_handlers

- name: Verify time synchronization
  ansible.builtin.command:
    cmd: timedatectl show --property=NTPSynchronized
  register: base_ntp_sync
  changed_when: false
  failed_when: "'yes' not in base_ntp_sync.stdout"
