---
base_packages:
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - python3
  - apt-utils
  - jq
  - unzip
  - htop
  - iotop
  - tmux
  - git
  - net-tools
  - iputils-ping
  - dnsutils
  - ethtool
  - apt-transport-https

base_ssh_port: 22
base_ssh_permit_root_login: "no"
base_ssh_password_authentication: "no"
base_ssh_pubkey_authentication: "yes"
base_ssh_kbd_interactive_auth: "no"
base_ssh_x11_forwarding: "no"
base_ssh_max_auth_tries: 3
base_ssh_login_grace_time: 60
base_ssh_client_alive_interval: 300
base_ssh_client_alive_count: 2

base_ntp_servers:
  - 0.pool.ntp.org iburst
  - 1.pool.ntp.org iburst
  - 2.pool.ntp.org iburst
  - 3.pool.ntp.org iburst

base_sysctl:
  # Required by k3s: bridge, pod-to-pod routing, IPv6 mesh
  net.bridge.bridge-nf-call-iptables: "1"
  net.bridge.bridge-nf-call-ip6tables: "1"
  net.ipv4.ip_forward: "1"
  net.ipv4.conf.all.forwarding: "1"
  net.ipv6.conf.all.forwarding: "1"
  # Mitigates IP spoofing and ICMP redirect attacks
  net.ipv4.conf.all.rp_filter: "1"
  net.ipv4.conf.default.rp_filter: "1"
  net.ipv4.icmp_echo_ignore_broadcasts: "1"
  net.ipv4.conf.all.accept_redirects: "0"
  net.ipv4.conf.default.accept_redirects: "0"
  net.ipv6.conf.all.accept_redirects: "0"
  net.ipv4.conf.all.send_redirects: "0"
  net.ipv4.conf.default.send_redirects: "0"
  net.ipv4.conf.all.accept_source_route: "0"
  # Scales for k3s node with many pods/services
  vm.swappiness: "10"
  fs.file-max: "2097152"
  net.core.somaxconn: "65535"
  net.ipv4.tcp_max_syn_backlog: "65535"

base_kernel_modules:
  - overlay
  - br_netfilter
  - ip_vs
  - ip_vs_rr
  - ip_vs_wrr
  - ip_vs_sh
  - nf_conntrack
