---
all:
  children:
    workstations:
      hosts:
        workstation:
          ansible_connection: local
          ansible_python_interpreter: /opt/homebrew/bin/python3
          homelab_host: homelab
          homelab_user: ansible
          homelab_kubernetes_server: "https://tinycloud:6443"

    # Delegated host — auto_silent suppresses Python discovery warning.
    servers:
      hosts:
        homelab:
          ansible_host: homelab
          ansible_user: ansible
          ansible_ssh_private_key_file: "~/.ssh/ansible"
          ansible_python_interpreter: auto_silent
