---
all:
  children:
    workstations:
      hosts:
        workstation:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
          homelab_host: homelab
          homelab_user: ansible
          homelab_ssh_key: "~/.ssh/ansible"
          homelab_kubernetes_server: "https://tinycloud:6443"

    # Server known to the workstation for delegation.
    servers:
      hosts:
        homelab:
          ansible_host: homelab
          ansible_user: ansible
          ansible_ssh_private_key_file: "~/.ssh/ansible"
