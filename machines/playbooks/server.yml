---
- name: Configure base host
  hosts: all
  become: true
  roles:
    - role: base
    - role: firewall

- name: Ensure storage is configured
  hosts: all
  become: true
  roles:
    - role: storage

- name: Install GPU runtime
  hosts: all
  become: true
  roles:
    - role: gpu

- name: Install K3s server
  hosts: all
  become: true
  roles:
    - role: k3s_server
