---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: vllm
  namespace: flux-system
spec:
  interval: 24h
  url: https://vllm-project.github.io/production-stack
---
apiVersion: v1
kind: Namespace
metadata:
  name: vllm
  labels:
    gateway-access: envoy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vllm
  namespace: vllm
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: vllm-stack
      version: "0.1.12"
      sourceRef:
        kind: HelmRepository
        name: vllm
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    servingEngineSpec:
      labels:
        release: prometheus
      serviceMonitor:
        enabled: true
        interval: 30s
      modelSpec:
        - name: qwen-instruct
          runtimeClassName: nvidia
          repository: vllm/vllm-openai
          tag: "v0.29.0"
          modelURL: Qwen/Qwen3-4B-AWQ
          requestCPU: 2
          requestMemory: "4Gi"
          requestGPU: 1
          requestGPUType: "nvidia.com/gpu"
          limitCPU: "4"
          limitMemory: "8Gi"
          pvcStorage: "10Gi"
          pvcAccessMode:
            - ReadWriteOnce
          vllmConfig:
            tensorParallelSize: 1
            maxModelLen: 4096
            dtype: "float16"
            quantization: "awq"
            gpuMemoryUtilization: 0.80
            extraArgs:
              - "--served-model-name"
              - "qwen3-4b"
    routerSpec:
      enableRouter: false
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vllm-api
  namespace: vllm
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - vllm.home.arpa
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: vllm-qwen-instruct-engine-service
          port: 80
