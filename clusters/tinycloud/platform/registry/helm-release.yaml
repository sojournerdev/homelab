apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zot
  namespace: zot
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: zot
      version: "0.1.134"
      sourceRef:
        kind: HelmRepository
        name: zot
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: zot
    replicaCount: 1
    strategy:
      type: Recreate
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    service:
      type: ClusterIP
      port: 5000
    persistence: true
    pvc:
      storage: 100Gi
      storageClassName: local-path
      accessModes:
        - ReadWriteOnce
    # Use the structured Secret-backed config below; disable chart file defaults.
    configFiles: {}
    secretFiles: {}
    config:
      storage:
        rootDirectory: /var/lib/registry
        commit: true
        dedupe: true
        gc: true
        gcDelay: 1h
        gcInterval: 24h
        gcTimeWindow: "01:00-05:00"
      http:
        address: 0.0.0.0
        port: 5000
      extensions:
        metrics:
          enable: true
          prometheus:
            path: /metrics
      log:
        level: info
