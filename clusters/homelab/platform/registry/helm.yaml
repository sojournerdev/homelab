apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: zot
  namespace: flux-system
spec:
  interval: 1h
  url: https://zotregistry.dev/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zot
  namespace: flux-system
spec:
  interval: 10m
  releaseName: zot
  targetNamespace: zot
  storageNamespace: zot
  install:
    crds: CreateReplace
    createNamespace: true
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: zot
      version: "0.1.134"
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: zot
  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              group: monitoring.coreos.com
              kind: ServiceMonitor
              name: zot
            patch: |
              - op: add
                path: /metadata/labels/observability.sojournerdev.com~1scrape
                value: "true"
  values:
    fullnameOverride: zot
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        interval: 30s
        path: /metrics
    strategy:
      type: Recreate
    service:
      type: ClusterIP
    persistence: true
    pvc:
      storage: 50Gi
      storageClassName: local-path
      accessModes:
        - ReadWriteOnce
    mountConfig: true
    configFiles:
      config.json: |-
        {
          "storage": {
            "rootDirectory": "/var/lib/registry",
            "gc": true,
            "gcInterval": "24h",
            "gcTimeWindow": "01:00-05:00"
          },
          "http": {
            "address": "0.0.0.0",
            "port": "5000"
          },
          "extensions": {
            "metrics": {
              "enable": true,
              "prometheus": {
                "path": "/metrics"
              }
            }
          },
          "log": {
            "level": "info"
          }
        }
