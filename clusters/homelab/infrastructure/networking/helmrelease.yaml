apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: metallb
  namespace: flux-system
spec:
  interval: 1h
  url: https://metallb.github.io/metallb
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: flux-system
spec:
  interval: 10m
  releaseName: metallb
  targetNamespace: metallb-system
  storageNamespace: metallb-system
  install:
    crds: CreateReplace
    createNamespace: true
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: metallb
      version: "0.16.1"
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: metallb
  values:
    frrk8s:
      enabled: false
    speaker:
      frr:
        enabled: false
