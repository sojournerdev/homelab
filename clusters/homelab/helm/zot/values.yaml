fullnameOverride: zot
strategy:
  type: Recreate
service:
  type: ClusterIP
persistence: true
pvc:
  storage: 50Gi
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
mountConfig: true
configFiles:
  config.json: |-
    {
      "storage": {
        "rootDirectory": "/var/lib/registry",
        "gc": true,
        "gcInterval": "24h",
        "gcTimeWindow": "01:00-05:00"
      },
      "http": {
        "address": "0.0.0.0",
        "port": "5000"
      },
      "extensions": {
        "metrics": {
          "enable": true,
          "prometheus": {
            "path": "/metrics"
          }
        }
      },
      "log": {
        "level": "info"
      }
    }
