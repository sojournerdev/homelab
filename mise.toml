[tools]
# ansible-core and ansible-lint are managed via pipx, not mise.
age = "1.3.2"
flux2 = "2.9.5"
helm = "4.3.0"
kubectl = "1.35.3"
kustomize = "5.8.1"
mkcert = "1.4.4"
actionlint = "1.7.7"
shellcheck = "0.11.0"
sops = "3.13.3"
yamllint = "1.36.1"

[env]
_.path = ["~/.local/bin"]
ANSIBLE_COLLECTIONS_PATH = "{{config_root}}/machines/collections:~/.ansible/collections"
KUBECONFIG = "{{ env.HOME }}/.kube/tinycloud/config"
SOPS_CONFIG = "{{config_root}}/.sops.yaml"
SOPS_AGE_KEY_FILE = "{{ env.HOME }}/.sops/age.agekey"

# ── Lint ──────────────────────────────────────────────────────────
[tasks.lint]
description = "Run all linters"
dir = "machines"
run = [
  "actionlint ../.github/workflows/*.yml",
  "shellcheck ../scripts/*.sh",
  "ansible-galaxy collection install -r requirements.yml -p ./collections",
  "ansible-lint roles/",
  "ansible-playbook playbooks/workstation.yml -i inventory/workstation.yml --syntax-check",
  "ansible-playbook playbooks/server.yml -i inventory/server.yml --syntax-check",
  "yamllint roles/ inventory/ playbooks/ ../clusters/tinycloud/infrastructure/ ../clusters/tinycloud/apps/",
]

# ── Check ─────────────────────────────────────────────────────────
[tasks.check]
description = "Run all checks"
depends = ["lint", "cluster-test"]

[tasks.cluster-test]
description = "Catch invalid Flux resources before deployment"
run = [
  "flux plugin install schema@0.5.0",
  "scripts/cluster-test-config.sh",
]

# ── Workstation ───────────────────────────────────────────────────
[tasks.workstation-init]
description = "Configure the workstation for homelab use"
run = "ansible-playbook playbooks/workstation.yml -i inventory/workstation.yml"
dir = "machines"

# ── Host ──────────────────────────────────────────────────────────
[tasks.host-deploy]
description = "Configure the homelab host"
confirm = "Apply configuration to homelab?"
run = "ansible-playbook playbooks/server.yml -i inventory/server.yml -c ssh"
dir = "machines"

[tasks.host-dry]
description = "Preview host changes without applying them"
run = "ansible-playbook playbooks/server.yml -i inventory/server.yml -c ssh --check --diff"
dir = "machines"

# ── TLS ──────────────────────────────────────────────────────────
[tasks.tls-generate]
description = "Generate TLS cert and store encrypted secret in Git"
run = "scripts/generate-tls.sh"
