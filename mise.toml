[tools]
# ansible-core and ansible-lint are managed via pipx, not mise.
k3d = "5.9.0"
kubectl = "1.35.3"
kustomize = "5.8.1"
helm = "4.3.0"
flux2 = "2.9.5"
age = "1.3.2"
sops = "3.13.3"
yamllint = "1.36.1"
shellcheck = "0.11.0"
kind = "0.33.0"
ctlptl = "0.9.6"

[env]
_.path = ["~/.local/bin"]
ANSIBLE_COLLECTIONS_PATH = "{{config_root}}/machines/collections:~/.ansible/collections"
KUBECONFIG = "{{ env.HOME }}/.kube/tinycloud/config"

# ── Workstation ───────────────────────────────────────────────────
[tasks.workstation-init]
description = "Configure the workstation for homelab use"
run = "ansible-playbook playbooks/workstation.yml -i inventory/workstation.yml"
dir = "machines"

[tasks.workstation-check]
description = "Check the workstation configuration before applying it"
run = "ansible-playbook playbooks/workstation.yml -i inventory/workstation.yml --syntax-check"
dir = "machines"

# ── Host ──────────────────────────────────────────────────────────
[tasks.host-check]
description = "Check the host configuration before deployment"
dir = "machines"
run = [
  "ansible-playbook playbooks/server.yml -i inventory/homelab.yml --syntax-check",
  "ansible-lint roles/",
  "yamllint roles/ inventory/ playbooks/",
]

[tasks.host-deploy]
description = "Configure the homelab host"
confirm = "Apply configuration to homelab?"
run = "ansible-playbook playbooks/server.yml -i inventory/homelab.yml -c ssh"
dir = "machines"

[tasks.host-deploy-check]
description = "Preview host changes without applying them"
run = "ansible-playbook playbooks/server.yml -i inventory/homelab.yml -c ssh --check --diff"
dir = "machines"

[tasks.scripts-check]
description = "Check shell scripts for common errors"
run = "shellcheck scripts/*.sh"

# ── Cluster ───────────────────────────────────────────────────────
[tasks.cluster-build-artifact]
description = "Build the artifact consumed by Flux"
run = "scripts/cluster-build-artifact.sh"

[tasks.cluster-test-config]
description = "Catch invalid Flux resources before deployment"
depends = ["cluster-build-artifact"]
run = [
  "flux plugin install schema@0.5.0",
  "scripts/cluster-test-config.sh",
]

[tasks.cluster-test-api-server]
description = "Validate resources against Kubernetes API rules"
depends = ["cluster-build-artifact"]
run = "scripts/cluster-test-api-server.sh"

[tasks.cluster-test]
description = "Run pre-deployment cluster validation"
depends = [
  "cluster-test-config",
  "cluster-test-api-server",
]
