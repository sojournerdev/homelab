[tools]
# Managed via pipx — ansible and ansible-lint are separate installs.
# Install: pipx install ansible-core && pipx install ansible-lint

# Kubernetes
k3d = "5.9.0"
kubectl = "1.35.3"
kustomize = "5.8.1"
helm = "4.3.0"

# GitOps
flux2 = "2.9.5"

# Security
age = "1.3.2"
sops = "3.13.3"

# Validation
kubeconform = "0.8.0"
yamllint = "1.36.1"
shellcheck = "0.11.0"

[env]
_.path = ["~/.local/bin"]
ANSIBLE_COLLECTIONS_PATH = "{{config_root}}/machines/collections:~/.ansible/collections"

# ── Ansible workflows ─────────────────────────────────────────────
[tasks.syntax]
description = "Check Ansible playbook syntax"
run = "ansible-playbook playbooks/site.yml -i inventory/homelab.yml --syntax-check"
dir = "machines"

[tasks.lint]
description = "Lint Ansible roles with ansible-lint"
run = "ansible-lint roles/"
dir = "machines"

[tasks.yamllint]
description = "Lint YAML files with yamllint"
run = "yamllint roles/ inventory/ playbooks/"
dir = "machines"

[tasks.check]
description = "Validate everything — syntax, lint, yamllint"
depends = ["syntax", "lint", "yamllint"]

[tasks.deploy]
description = "Run full playbook against homelab"
run = "ansible-playbook playbooks/site.yml -i inventory/homelab.yml -c ssh"
dir = "machines"

[tasks.deploy-check]
description = "Dry-run playbook — no changes applied"
run = "ansible-playbook playbooks/site.yml -i inventory/homelab.yml -c ssh --check"
dir = "machines"

# ── K8s validation workflows ──────────────────────────────────────
[tasks.validate]
description = "Validate k8s manifests including CRDs"
run = "./scripts/validate.sh"

[tasks.build]
description = "Render kustomize overlays"
run = "./scripts/build.sh"

[tasks.diff]
description = "Flux diff — show what would change on cluster"
run = "flux diff kustomization infrastructure --path clusters/tinycloud/infrastructure"
