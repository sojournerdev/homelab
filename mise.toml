[tools]
uv = "0.9.18"
python = "3.14.7"
age = "1.3.2"
helm = "4.3.0"
kubectl = "1.35.3"
kustomize = "5.8.1"
shellcheck = "0.11.0"
actionlint = "1.7.12"
sops = "3.13.3"
yamllint = "1.36.1"

[env]
_.file = ".env"
_.python.venv = { path = "machines/.venv", create = true }
CLUSTER_DIR = "clusters/homelab"
HELM_TIMEOUT = "5m"

# ── Setup ─────────────────────────────────────────────────────────
[tasks.python-deps]
description = "Install locked Ansible controller dependencies"
dir = "machines"
run = "uv pip sync requirements.lock"

[tasks.collections]
description = "Install pinned Ansible collections"
depends = ["python-deps"]
dir = "machines"
run = "ansible-galaxy collection install -r requirements.yml"

[tasks.ansible-setup]
description = "Prepare the Ansible controller environment"
depends = ["collections"]

# ── Server workflows ─────────────────────────────────────────────
[tasks.server-check]
description = "Preview Ansible server changes"
depends = ["collections"]
dir = "machines"
run = "ansible-playbook playbooks/server.yml -i inventory/server.yml -c ssh --check --diff"

[tasks.server-apply]
description = "Apply Ansible server configuration"
depends = ["collections"]
dir = "machines"
confirm = "Apply server configuration?"
run = "ansible-playbook playbooks/server.yml -i inventory/server.yml -c ssh"

# ── Cluster workflows ────────────────────────────────────────────
[tasks.cluster-render]
description = "Render cluster resources with Kustomize"
run = "kubectl kustomize $CLUSTER_DIR >/dev/null"

[tasks.cluster-apply]
description = "Apply the homelab cluster"
run = "scripts/cluster-apply.sh"

# ── Validation workflows ─────────────────────────────────────────
[tasks.ansible-doctor]
description = "Check Ansible controller prerequisites"
depends = ["collections"]
dir = "machines"
run = [
  "ansible --version",
  "ansible-galaxy collection list",
]

[tasks.ansible-validate]
description = "Validate Ansible syntax and inventories"
depends = ["collections"]
dir = "machines"
run = [
  "ansible-inventory -i inventory/server.yml --list >/dev/null",
  "ansible-playbook playbooks/server.yml -i inventory/server.yml --syntax-check",
]

[tasks.ansible-lint]
description = "Lint Ansible content"
depends = ["collections"]
dir = "machines"
run = "ansible-lint roles/ playbooks/"

[tasks.yaml-lint]
description = "Lint YAML files"
depends = ["python-deps"]
run = "yamllint .github clusters machines .yamllint"

[tasks.shell-lint]
description = "Lint workflows and shell scripts"
run = [
  "actionlint .github/workflows/*.yml",
  "shellcheck scripts/*.sh",
]

[tasks.cluster-validate]
description = "Validate rendered cluster resources"
depends = ["cluster-render"]

[tasks.ansible-validation]
description = "Validate Ansible content"
depends = ["ansible-lint", "ansible-validate"]

[tasks.static-analysis]
description = "Run static analysis"
depends = ["yaml-lint", "shell-lint"]

[tasks.lint]
description = "Run repository linters"
depends = ["static-analysis", "ansible-validation"]

[tasks.ci]
description = "Run all non-mutating CI validation"
depends = [
  "lint",
  "cluster-validate",
]
